name: Build

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet publish ScreenStats.App/ScreenStats.App.csproj -c Release -r win-x64 -p:WarningLevel=0 -p:DebugType=None -p:DefineConstants="INSTALLER" -o ..\publish

    - name: Portable Exe
      run: dotnet publish ScreenStats.App/ScreenStats.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:WarningLevel=0 -p:DebugType=None -p:DefineConstants="PORTABLE" -o ..\publish-portable

    - name: Get version
      id: version
      shell: pwsh
      run: |
        $xml = [xml](Get-Content (Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1).FullName)
        $version = $xml.Project.PropertyGroup.Version
        if (-not $version) { $version = "1.0.0" }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Compile Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: Installer/setup.iss
        options: /O+

    - name: Zip Portable
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        Compress-Archive -Path "..\publish-portable\*" -DestinationPath "ScreenStats-$version-Portable.zip"

    - name: Rename Installer
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $installer = Get-ChildItem -Path "Installer\Output" -Filter "*.exe" | Select-Object -First 1
        Rename-Item -Path $installer.FullName -NewName "ScreenStats-$version-Installer.exe"

    - name: Upload Portable
      uses: actions/upload-artifact@v4
      with:
        name: ScreenStats-${{ steps.version.outputs.VERSION }}-Portable
        path: ScreenStats-${{ steps.version.outputs.VERSION }}-Portable.zip

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: ScreenStats-${{ steps.version.outputs.VERSION }}-Installer
        path: Installer/Output/ScreenStats-${{ steps.version.outputs.VERSION }}-Installer.exe
