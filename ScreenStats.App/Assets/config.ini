[layout]
orientation = Vertical
left = 20
bottom = 20
width = 500
spacing = 10

[background]
enabled = true
color = #33000000
padding = 10
cornerRadius = 10

[widgets:1]
type = text
content = My Cool Widget!
fontFamily = Arial
fontSize = 32

[widgets:2]
type = cpu
label = CPU Usage
fontFamily = Cascadia Code
fontSize = 18
valueFontSize = 28
color = #00ff88
showBar = true

[widgets:3]
type = ram
label = Ram Usage
fontFamily = Cascadia Code
fontSize = 18
valueFontSize = 28
color = #00ff88
showBar = true

[widgets:4]
type = media
showArtist = true
showStatus = true
showThumbnail = true

[widgets:5]
type = drive
drive = C:
content = {label}: {used} / {total} ({percentage} used)
fontFamily = Cascadia Code
fontSize = 18
color = #00ff88
showBar = true
