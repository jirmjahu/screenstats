[layout]
orientation = Vertical
left = 20
bottom = 20
width = 500
spacing = 10

[background]
enabled = true
color = #70000000
padding = 15
cornerRadius = 10

[widgets:1]
type = text
content = My Cool Widget!
fontFamily = Cascadia Code
size = 30

[widgets:2]
type = cpu
label = CPU
fontFamily = Cascadia Code
size = 15
valueSize = 25
color = #C8FFBE
showBar = true

[widgets:3]
type = ram
label = RAM
fontFamily = Cascadia Code
size = 15
valueSize = 25
color = #9FB3FC
showBar = true

[widgets:4]
type = drive
drive = C:
content = {label} ({letter}) {used} / {free}
fontFamily = Cascadia Code
size = 15
color = #EDFFAB
showBar = true

[widgets:5]
type = media
showArtist = true
showStatus = true
showThumbnail = true


