[layout]
orientation = Vertical
left = 25
bottom = 25
width = 500
spacing = 12

[background]
enabled = true
color = #70000000
padding = 15
cornerRadius = 10

[defaults]
fontFamily = Cascadia Code
fontWeight = SemiBold
fontStyle = Normal
size = 15
valueSize = 25
showBar = true

[widgets:1]
type = text
content = {computer}
size = 30

[widgets:2]
type = text
content = {os} • {arch}

[widgets:3]
type = text
content = {day}, {date} • {time}

[widgets:4]
type = text
content = Uptime: {uptime}

[widgets:5]
type = cpu
content = CPU
color = #C8FFBE

[widgets:6]
type = ram
content = Memory
color = #9FB3FC

[widgets:7]
type = drive
drive = C:
content = {label} ({letter}) • {used} / {total}
color = #EDFFAB

[widgets:8]
type = media
content = {title}
color = #FFFFFF
showArtist = true
showStatus = false
showThumbnail = true
thumbnailSize = 55

[widgets:9]
type = weather
country = Germany
city = Berlin
temperatureUnit = celsius
windSpeedUnit = kmh
content = {icon} {location} • {temp}{temp_unit} • {description}
color = #FFEF9F