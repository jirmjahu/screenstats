[layout]
orientation = Vertical
left = 20
bottom = 20
width = 500
spacing = 10

[background]
enabled = true
color = #70000000
padding = 15
cornerRadius = 10

[defaults]
fontFamily = Cascadia Code
size = 15
valueSize = 25
showBar = true

[widgets:1]
type = text
content = My Cool Widget!
size = 30

[widgets:2]
type = cpu
content = CPU
color = #C8FFBE

[widgets:3]
type = ram
content = RAM
color = #9FB3FC

[widgets:4]
type = drive
drive = C:
content = {label} ({letter}) {used} / {total}
color = #EDFFAB

[widgets:5]
type = media
content = "{title} · {position}/{duration}"
color = #FFFFFF
showArtist = true
showStatus = true
showThumbnail = true
thumbnailSize = 50